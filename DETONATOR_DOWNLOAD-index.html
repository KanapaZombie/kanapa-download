<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DETONATOR // STRESS RELIEF PROTOCOL</title>
  <style>
    :root {
      --bg: #050505;
      --yellow: #ffcc00;
      --dim: #3a3000;
      --red: #ff3333;
      --text: #ffe680;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      color: var(--yellow);
      margin-bottom: 0.3rem;
      text-shadow: 0 0 10px var(--yellow);
    }
    .subtitle {
      font-size: 0.7rem;
      color: #8a7a30;
      margin-bottom: 2rem;
      letter-spacing: 0.1em;
    }
    #input-screen, #blast-screen {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }
    #blast-screen { display: none; }
    label {
      display: block;
      font-size: 0.7rem;
      color: #8a7a30;
      margin-bottom: 0.3rem;
      letter-spacing: 0.08em;
    }
    input[type="text"], select {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid var(--dim);
      color: var(--yellow);
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      outline: none;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--yellow);
      box-shadow: 0 0 8px rgba(255,204,0,0.35);
    }
    .row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }
    .row > div { flex: 1; }
    #initiate {
      display: block;
      width: 140px;
      height: 140px;
      margin: 1.8rem auto 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #330000, #110000);
      border: 3px solid var(--red);
      color: var(--red);
      font-size: 2.2rem;
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
      box-shadow: 0 0 15px rgba(255,50,50,0.4);
    }
    #initiate:hover {
      box-shadow: 0 0 28px rgba(255,50,50,0.75);
      transform: scale(1.05);
    }
    #initiate:active { transform: scale(0.97); }
    #initiate span {
      position: absolute;
      bottom: 18px;
      left: 0; right: 0;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
    }
    .disclaimer {
      margin-top: 2.5rem;
      font-size: 0.65rem;
      color: #444;
      text-align: center;
      max-width: 320px;
      line-height: 1.4;
    }
    .disclaimer span { color: #885500; }

    #canvas {
      background: #000;
      border: 1px solid #3a3000;
      display: block;
      margin: 0 auto 1rem;
    }
    #status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--yellow);
      min-height: 2.5rem;
      margin-bottom: 0.8rem;
      letter-spacing: 0.05em;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: #8a7a30;
      margin-bottom: 1rem;
      padding: 0 0.5rem;
    }
    #reset {
      display: block;
      margin: 1.5rem auto 0;
      background: none;
      border: 1px solid #333;
      color: #666;
      padding: 0.5rem 1.4rem;
      font-family: inherit;
      font-size: 0.7rem;
      cursor: pointer;
      letter-spacing: 0.1em;
    }
    #reset:hover { border-color: #555; color: #aaa; }
  </style>
</head>
<body>
  <div id="input-screen">
    <h1>DETONATOR</h1>
    <div class="subtitle">EVERYBODY NEEDS SOMEBODY TO BOMB</div>

    <label>TARGET / DELIVERY LOCATION</label>
    <input type="text" id="target" maxlength="32" placeholder="name, place, 'work', 'monday'..." autocomplete="off">

    <div class="row">
      <div>
        <label>YIELD</label>
        <select id="yield">
          <option value="20">20 kt</option>
          <option value="50">50 kt</option>
          <option value="200">200 kt</option>
          <option value="1000">1 mt</option>
          <option value="5000">5 mt</option>
          <option value="10000">10 mt</option>
          <option value="50000">50 mt</option>
          <option value="100000">100 mt</option>
        </select>
      </div>
      <div>
        <label>DELIVERY SYSTEM</label>
        <select id="type">
          <option>ICBM</option>
          <option>BOMB</option>
          <option>DRONE</option>
          <option>ORBITAL STRIKE</option>
        </select>
      </div>
    </div>

    <button id="initiate">☢<span>INITIATE</span></button>

    <div class="disclaimer">
      <span>⚠</span> DUMB APPS DON'T KILL. NUKES DO.<br>
      This is a digital stress ball. Nothing more.
    </div>
  </div>

  <div id="blast-screen">
    <div id="status">ACQUIRING TARGET...</div>
    <div id="hud">
      <span id="hud-yield">YIELD: —</span>
      <span id="hud-type">TYPE: —</span>
      <span id="hud-rad">RAD: 0 mSv</span>
    </div>
    <canvas id="canvas" width="380" height="300"></canvas>
    <button id="reset">NEW TARGET</button>
  </div>

  <script>
    let audioCtx;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playBell() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    // More recognizable old-school Geiger clicks
    function playGeiger(intensity = 1) {
      const duration = 2.2 + intensity * 2.0;
      const count = Math.floor(18 + intensity * 40);
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.value = 1800 + Math.random() * 1200;
          const vol = 0.035 * intensity * (0.6 + Math.random() * 0.8);
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.035);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.04);
        }, Math.random() * duration * 1000);
      }
    }

    const inputScreen = document.getElementById('input-screen');
    const blastScreen = document.getElementById('blast-screen');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const hudYield = document.getElementById('hud-yield');
    const hudType = document.getElementById('hud-type');
    const hudRad = document.getElementById('hud-rad');

    let targetText = '';
    let yieldKt = 20;
    let animId = null;

    const punchlines = [
      t => `TEST SUCCESSFUL<br>${t.toUpperCase()} ELIMINATED`,
      t => `ANOTHER ONE BITES THE BLAST`,
      t => `TARGET NEUTRALIZED<br>THANK YOU FOR YOUR ATTENTION TO THIS MATTER`,
      t => `WUBBA LUBBA DUB DUB<br>${t.toUpperCase()} IS GONE`,
      t => `PROBLEM SOLVED<br>(TEMPORARILY)`,
      t => `CLEAN HIT<br>${t.toUpperCase()} NO LONGER A FACTOR`,
      t => `MISSION ACCOMPLISHED<br>GO HAVE A NICE DAY`,
      t => `VECTOR CONFIRMED<br>${t.toUpperCase()} HAS LEFT THE CHAT`
    ];

    // Simple geo-map silhouette + grid
    function drawGrid() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);

      // faint landmass shapes (very abstract geo look)
      ctx.fillStyle = '#0c0c00';
      ctx.beginPath();
      ctx.moveTo(40, 80); ctx.lineTo(120, 60); ctx.lineTo(180, 90);
      ctx.lineTo(160, 160); ctx.lineTo(70, 170); ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(220, 50); ctx.lineTo(320, 40); ctx.lineTo(350, 110);
      ctx.lineTo(300, 180); ctx.lineTo(210, 150); ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(30, 200); ctx.lineTo(110, 190); ctx.lineTo(140, 250);
      ctx.lineTo(60, 270); ctx.closePath();
      ctx.fill();

      // grid on top
      ctx.strokeStyle = '#2a2200';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 20) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 20) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      // header
      ctx.fillStyle = '#5a4a00';
      ctx.font = '12px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('B L A S T   Z O N E', w/2, 22);

      // target
      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 16px Courier New';
      ctx.fillText(targetText.toUpperCase().slice(0, 28), w/2, h/2 + 6);
    }

    document.getElementById('initiate').addEventListener('click', () => {
      initAudio();
      targetText = document.getElementById('target').value.trim() || 'UNKNOWN TARGET';
      yieldKt = parseInt(document.getElementById('yield').value, 10);
      const delivery = document.getElementById('type').value;

      inputScreen.style.display = 'none';
      blastScreen.style.display = 'block';

      hudYield.textContent = `YIELD: ${yieldKt >= 1000 ? (yieldKt/1000)+' mt' : yieldKt+' kt'}`;
      hudType.textContent = `TYPE: ${delivery}`;
      hudRad.textContent = `RAD: 0 mSv`;
      statusEl.textContent = 'ACQUIRING TARGET...';

      startSequence();
    });

    document.getElementById('reset').addEventListener('click', () => {
      cancelAnimationFrame(animId);
      blastScreen.style.display = 'none';
      inputScreen.style.display = 'block';
      document.getElementById('target').value = '';
    });

    function startSequence() {
      const w = canvas.width;
      const h = canvas.height;
      let progress = 0;
      const duration = 4200;
      const start = performance.now();

      function frame(now) {
        progress = Math.min(1, (now - start) / duration);
        drawGrid();

        const x2 = 30 + progress * (w/2 - 30);
        const y2 = 40 + progress * (h/2 - 40);

        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(20, 30);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x2 - 6, y2); ctx.lineTo(x2 + 6, y2);
        ctx.moveTo(x2, y2 - 6); ctx.lineTo(x2, y2 + 6);
        ctx.stroke();

        if (progress < 1) {
          animId = requestAnimationFrame(frame);
        } else {
          impact();
        }
      }
      animId = requestAnimationFrame(frame);
    }

    function impact() {
      playBell();

      // white flash
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      setTimeout(() => {
        let radius = 8;
        const maxR = 55 + Math.log10(yieldKt) * 28;
        const intensity = Math.min(1.4, Math.log10(yieldKt) / 4.5);

        function expand() {
          drawGrid();

          // classic white fading circle (DEFCON style)
          const alpha = Math.max(0, 1 - radius / maxR);
          ctx.beginPath();
          ctx.arc(canvas.width/2, canvas.height/2, radius, 0, Math.PI*2);
          ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.95})`;
          ctx.lineWidth = 2.5;
          ctx.stroke();

          // soft outer glow
          ctx.beginPath();
          ctx.arc(canvas.width/2, canvas.height/2, radius * 1.15, 0, Math.PI*2);
          ctx.strokeStyle = `rgba(255,220,100,${alpha * 0.25})`;
          ctx.lineWidth = 1;
          ctx.stroke();

          radius += 2.4;
          if (radius < maxR) {
            requestAnimationFrame(expand);
          } else {
            const line = punchlines[Math.floor(Math.random() * punchlines.length)](targetText);
            statusEl.innerHTML = line;
            const rad = Math.round(yieldKt * 0.85 + Math.random() * 60);
            hudRad.textContent = `RAD: ${rad} mSv`;
            playGeiger(intensity);          // mandatory Geiger
          }
        }
        expand();
      }, 160);
    }
  </script>
</body>
</html>
